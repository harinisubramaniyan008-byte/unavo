<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></script>
<style>.bounce{animation:bounce 1s infinite} @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.slide{animation:slide 0.6s ease-out} @keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}</style></head>
<body class="bg-black text-white p-6"><a href="dashboard.html" class="text-lime-400">← Dashboard</a>
<h1 class="text-3xl font-bold mt-2">🗺️ Matching + Location - LIVE</h1>
<div class="grid grid-cols-2 gap-6 mt-6">
<div id="list" class="space-y-3"></div>
<div class="bg-[#111] p-3 rounded-2xl border border-white/10">
<iframe class="w-full h-[300px] rounded-xl" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3929.7!2d78.11!3d9.92!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b00c582b1187f5%3A0x9b5c3b!2sMattuthavani!5e0!3m2!1sen!2sin"></iframe>
<div class="mt-3 bg-black p-3 rounded-xl text-xs"><span class="bounce inline-block">📍</span> NGO Location Blinking • Donor location bouncing</div>
</div></div>
<script>
let foods=[{n:'Veg Meals 30 plates',d:2.1,l:'Mattuthavani'},{n:'Curd Rice 20 plates',d:0.8,l:'Meenakshi Temple'},{n:localStorage.getItem('latestFood')||'Sambar 60 plates',d:1.4,l:'Your Food'}];
document.getElementById('list').innerHTML=foods.map((f,i)=>`<div class="slide bg-[#18181b] border border-white/10 p-4 rounded-2xl flex justify-between" style="animation-delay:${i*0.2}s"><div><b>${f.n}</b><p class="text-xs text-zinc-400">📍 ${f.l} • <span class="text-lime-400">${f.d}km</span> • <span class="bounce">🔴 LIVE</span></p></div><button onclick="location='notify.html'" class="bg-lime-400 text-black px-4 py-2 rounded-full text-sm font-bold hover:scale-110 transition">Claim</button></div>`).join('');
</script></body></html>
